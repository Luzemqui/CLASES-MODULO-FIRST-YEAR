<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> REGISTRO </title>
    
    <script>
        let usuarios = [];
        
        function registro() {
   
            let txUsuario = document.getElementById("usuario").value;
            let txContraseña = document.getElementById("contraseña").value;

            if (txUsuario === "" || txContraseña === "") {
                alert("Por favor, completa todos los campos.");
                return;
            }

            let nuevoUsuario = {
                 usuario: txUsuario,
                 contraseña: txContraseña
            };

            usuarios.push(nuevoUsuario);

            alert("Usuario registrado con éxito");
            console.log(usuarios);
            
           
            document.getElementById("usuario").value = "";
            document.getElementById("contraseña").value = "";
        }
    </script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            border-color: blue;
            width: 400px;
            height: 400px;
            border: 5px solid rgba(0, 132, 255, 0.3);
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 132, 255, 0.3);
            background-color: white;
        }
        .label {
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            font-weight: 600;
        }
      
        .input {
            color: black;
            text-align: center;
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .boton {
            color: white; 
            font-weight: 600;
            background-color: blue;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .boton:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <div class="container">
        <form onsubmit="return false;">
            <div>
                <label class="label">USUARIO</label><br>
  
                <input type="text" id="usuario" class="input"><br>
            </div>
            
            <div>
                <label class="label">CONTRASEÑA</label><br>
           
                <input type="password" id="contraseña" class="input"><br>
            </div>
            
            <div>
             
                <input type="button" value="Enviar" class="boton" onclick="registro()">
            </div>
        </form>
    </div>

</body>
</html>
