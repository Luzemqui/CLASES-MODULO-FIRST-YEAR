<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width.device-width, inital-scale-1.0">
    <title>Carrito de compras</title>
    <link rel="stylesheet" href="estilo.css">

    <style>
            body{
                margin: 0;
                font-family: Arial;
            }

            nav {
                background: #333;
            }

            ul {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            li {
                border-bottom: 1px solid #555;
            }

            a{
                color: white;
                text-decoration: none;
                display: block;
                padding: 10px;
            }

            menu {
                display: none;
            }

            label {
                color: white;
                display: block;
                padding: 10px;
                cursor: pointer;
                background: #333;
            }

            ul {
                display: none;
            }

            #menu:checked + ul{
                display: block;
            }

            @media (min-width: 768px) {

                label {
                    display: none;
                }

                ul {
                    display: flex;
                }

                li {
                    border: none;
                }
            }
        </style>
</head>
<body>
    <header>
        <h1>Tienda tech</h1>
        <div class="cart-icon">
            🛒 <span id="cart-count">0</span>
        </div>
        <div class="menu">
             <nav>
            <label for="menu">≡ Menú</label>
            <input type="checkbox" id="menu">

            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="products">
            <div class="product-card">
                <h3>Laptop pro</h3>
                <p>$1200</p>
                <button class="add-btn" data-id="1" data-name="Laptop pro" data-price="1200">Añdir al carrito</button>
            </div>
            <div class="product-card">
                <h3>Auriculares H1-F!</h3>
                <p>$150</p>
                <button class="add-btn" data-id="2" data-name="Auriculares H1-F1" data-price="150">Añadir al carrito</button>
            </div>
        </section>

        <section class="cart-container">
            <h2>Tu carrito</h2>
            <ul id="cart-items">
                </ul>
            <div class="total-section">
                <strong>Total :$<span id="total-price">0</span></strong>
                <button id="clear-cart">Vaciar carrito :(</button>
            </div>
        </section>
    </main>
    <script src="funciones.js"></script>
</body>
</html>
