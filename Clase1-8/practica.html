<body>
    <div>
        <h1>CRUD de register de usuario</h1>

            <form action="">

            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" class="Name" required><br><br>
            <label for="Apellidos">Apellidos</label> <br><br>
            <input type="text" id="Apellidos" name="Apellidos" placeholder="Ingrese sus apellidos" class="Apellidos" required><br><br>
            <div class ="submit-bttn">
                <button type="submit">Enviar</button>
            </div>
            </form>
        </div>

        <div class="tabla">
            <table border="2" class="tabla">

                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                    </tr>

                <tbody id="TablaUsuarios"></tbody>
            </table>
        </div>
    </div>
