<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD Usuarios</title>

  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <div class="container">
    <h1>CRUD Usuarios - HTML + CSS + JS</h1>

    <div class="form-box">
      <h3 id="formTitle">Agregar Usuario</h3>
      <input type="text" id="nombre" placeholder="Nombre">
      <input type="email" id="email" placeholder="Email">
      <button class="btn btn-add" onclick="guardar()">Guardar</button>
    </div>

    <div class="table-box">
      <table>
        <thead>
          <div class="Grafica">
            <h5>Gráfica de Usuarios</h5>
            <button class="grafica" toogle="grafica()"></button>
          </div>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
